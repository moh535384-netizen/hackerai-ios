name: Build HackerAI IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # خادم macOS من GitHub (مجهّز بـ Xcode) — لا تدفع ثمن Mac
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      # ---------- 1) بناء .app بدون توقيع + تعبئته في .ipa ----------
      - name: Build unsigned .app
        run: |
          set -euo pipefail
          xcodebuild \
            -project HackerAI.xcodeproj \
            -scheme HackerAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            BUILD_ACTIVE_ARCH_ONLY=NO \
            clean build

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n1)
          echo "App bundle: $APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry HackerAI-unsigned.ipa Payload)
          ls -lh out/HackerAI-unsigned.ipa

      # ---------- 2) (اختياري) توقيع Ad Hoc إن أضفت الأسرار ----------
      # أضف في GitHub > Settings > Secrets:
      #   BUILD_CERTIFICATE_BASE64  (شهادة .p12 مُرمّزة base64)
      #   P12_PASSWORD
      #   PROVISIONING_PROFILE_BASE64 (ملف .mobileprovision مُرمّز base64)
      #   KEYCHAIN_PASSWORD          (أي كلمة مرور مؤقتة)
      - name: Import signing certificate
        if: ${{ vars.SIGNING_ENABLED == 'true' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Rebuild with signing
        if: ${{ vars.SIGNING_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project HackerAI.xcodeproj \
            -scheme HackerAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build

          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n1)
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry HackerAI-signed.ipa Payload)
          ls -lh out/HackerAI-signed.ipa

      # ---------- 3) رفع الملفات كنتائج قابلة للتنزيل ----------
      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HackerAI-IPA
          path: out/*.ipa
          if-no-files-found: warn
